<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Buddy for Zammad</title>
    <link rel="stylesheet" href="../core/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="zb-popup">
    <header class="topbar">
      <div class="brand">
        <img src="../icons/icon-48.png" width="22" height="22" alt="" class="brand-logo" />
        <h1 data-i18n="appTitle">Buddy for Zammad</h1>
        <button type="button" class="host-chip" id="hostChip" hidden></button>
      </div>

      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="de">DE</button>
      </div>
    </header>

    <nav class="popup-tabs" role="tablist">
      <button type="button" class="popup-tab" data-tab="settings" role="tab" aria-controls="panelSettings">
        <svg
          width="13"
          height="13"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" />
          <circle cx="5.5" cy="4.5" r="1.4" fill="var(--zb-bg-chrome)" />
          <circle cx="10.5" cy="8" r="1.4" fill="var(--zb-bg-chrome)" />
          <circle cx="6.5" cy="11.5" r="1.4" fill="var(--zb-bg-chrome)" />
        </svg>
        <span data-i18n="tabSettings">Settings</span>
      </button>
      <button type="button" class="popup-tab" data-tab="instances" role="tab" aria-controls="panelInstances">
        <svg
          width="13"
          height="13"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.65"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="8" cy="8" r="5.8" />
          <path
            d="M2.4 8h11.2M8 2.2c1.7 1.6 2.6 3.6 2.6 5.8S9.7 12.2 8 13.8c-1.7-1.6-2.6-3.6-2.6-5.8S6.3 3.8 8 2.2z"
          />
        </svg>
        <span data-i18n="tabInstances">Instances</span>
        <span class="tab-count" id="instanceCount">0</span>
      </button>
    </nav>

    <!-- Tab 1: settings. Each checkbox maps to a setting via data-setting. -->
    <section class="tab-panel" id="panelSettings" role="tabpanel">
      <h2 class="section-title" data-i18n="wysiwygHeading">Editor &amp; search</h2>

      <label class="setting-row setting-row--master">
        <span class="setting-copy">
          <span class="setting-title" data-i18n="settingWysiwygTitle"></span>
          <span class="setting-desc" data-i18n="settingWysiwygDesc"></span>
        </span>
        <input type="checkbox" class="toggle-switch" data-setting="wysiwygEnabled" />
      </label>

      <div class="sub-settings" data-depends-on="wysiwygEnabled">
        <label class="setting-row">
          <span class="setting-copy">
            <span class="setting-title" data-i18n="settingWysiwygExpandedTitle"></span>
            <span class="setting-desc" data-i18n="settingWysiwygExpandedDesc"></span>
          </span>
          <input type="checkbox" class="toggle-switch" data-setting="wysiwygCollapsed" data-invert />
        </label>
      </div>

      <label class="setting-row">
        <span class="setting-copy">
          <span class="setting-title" data-i18n="settingInPageSearchTitle"></span>
          <span class="setting-desc" data-i18n="settingInPageSearchDesc"></span>
        </span>
        <input type="checkbox" class="toggle-switch" data-setting="inPageSearchEnabled" />
      </label>

      <h2 class="section-title section-title--spaced" data-i18n="settingsHeading">Format Guard</h2>

      <label class="setting-row setting-row--master">
        <span class="setting-copy">
          <span class="setting-title" data-i18n="settingEnabledTitle"></span>
          <span class="setting-desc" data-i18n="settingEnabledDesc"></span>
        </span>
        <input type="checkbox" class="toggle-switch" data-setting="enabled" />
      </label>

      <div class="sub-settings" data-depends-on="enabled">
        <label class="setting-row">
          <span class="setting-copy">
            <span class="setting-title" data-i18n="settingAutoCleanTitle"></span>
            <span class="setting-desc" data-i18n="settingAutoCleanDesc"></span>
          </span>
          <input type="checkbox" class="toggle-switch" data-setting="autoCleanPaste" />
        </label>

        <label class="setting-row">
          <span class="setting-copy">
            <span class="setting-title" data-i18n="settingXrayTitle"></span>
            <span class="setting-desc" data-i18n="settingXrayDesc"></span>
          </span>
          <input type="checkbox" class="toggle-switch" data-setting="xrayHighlight" />
        </label>

        <label class="setting-row">
          <span class="setting-copy">
            <span class="setting-title" data-i18n="settingQuotesTitle"></span>
            <span class="setting-desc" data-i18n="settingQuotesDesc"></span>
          </span>
          <input type="checkbox" class="toggle-switch" data-setting="preserveBlockquotes" />
        </label>
      </div>

      <p class="hint" data-i18n="signatureNote"></p>
    </section>

    <!-- Tab 2: Zammad instances -->
    <section class="tab-panel" id="panelInstances" role="tabpanel" hidden>
      <div class="tab-banner" id="tabBanner">
        <div class="tab-status">
          <span class="status-dot" id="tabStatusDot"></span>
          <span class="tab-status-text" id="tabStatusText"></span>
        </div>
        <button type="button" class="btn btn--primary btn--block" id="btnConnectCurrent" hidden></button>
      </div>

      <h2 class="section-title" data-i18n="instancesHeading">Zammad instances</h2>

      <form class="add-form" id="addInstanceForm" novalidate>
        <input
          type="url"
          id="inputInstanceUrl"
          class="field"
          data-i18n-placeholder="instanceInputPlaceholder"
          data-i18n-aria-label="instancesHeading"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit" class="btn" data-i18n="addInstanceBtn">Add</button>
      </form>

      <p class="form-feedback" id="formFeedback" role="alert" hidden></p>

      <ul class="instance-list" id="instanceList"></ul>
      <p class="hint" id="emptyInstancesHint" data-i18n="instancesEmpty" hidden></p>
    </section>

    <footer class="footer">
      <span class="footer-stats" id="txtStats"></span>
      <span class="credit">
        <a
          class="author-link"
          href="https://github.com/drw1337/Zammad-Buddy"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="authorCredit"
          data-i18n-title="authorLinkTitle"
          >by drw1337</a
        >
        <a
          href="https://buymeacoffee.com/meyn"
          target="_blank"
          rel="noopener noreferrer"
          class="bmc-link"
          data-i18n-title="bmcTitle"
          aria-label="Buy Me a Coffee"
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.55"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 6.5h7.5v3.2a3.3 3.3 0 0 1-3.3 3.3H6.3A3.3 3.3 0 0 1 3 9.7V6.5z" />
            <path d="M10.5 7.2h1.3a1.6 1.6 0 0 1 0 3.2h-1.3" />
            <path d="M5.2 2.6v1.6M7.8 2.2v2" />
            <path d="M2.3 14.2h9" />
          </svg>
        </a>
        <span aria-hidden="true">·</span>
        <span id="versionLabel">v0.4.0</span>
      </span>
    </footer>

    <script src="../core/locales/en.js"></script>
    <script src="../core/locales/de.js"></script>
    <script src="../core/i18n.js"></script>
    <script src="../core/storage.js"></script>
    <script src="../core/safe-html.js"></script>
    <script src="lib/browser-api.js"></script>
    <script src="lib/settings-tab.js"></script>
    <script src="lib/instances-tab.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
